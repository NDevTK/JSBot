<!DOCTYPE html>
<html>
<head><title>JSBot Test Suite</title></head>
<body>
<h1>JSBot Detection Test Suite</h1>

<!-- ================================================================
     TAINT FLOWS — each inline script tests a specific source->sink
     ================================================================ -->

<!-- T01: postMessage data -> innerHTML (no origin check) -->
<script>
window.addEventListener("message", function(event) {
    document.getElementById("t01").innerHTML = event.data;
});
</script>

<!-- T02: postMessage data -> eval (weak origin check with indexOf) -->
<script>
window.addEventListener("message", function(evt) {
    if (evt.origin.indexOf("trusted") !== -1) {
        eval(evt.data);
    }
});
</script>

<!-- T03: localStorage.getItem -> innerHTML -->
<script>
var stored = localStorage.getItem("user_prefs");
document.getElementById("t03").innerHTML = stored;
</script>

<!-- T04: sessionStorage bracket -> document.write -->
<script>
var sess = sessionStorage["redirect_url"];
document.write(sess);
</script>

<!-- T05: URLSearchParams -> innerHTML -->
<script>
var params = new URLSearchParams(window.location.search);
var name = params.get("name");
document.getElementById("t05").innerHTML = name;
</script>

<!-- T06: location.search -> fetch (taint-only sink) -->
<script>
var endpoint = location.search.substring(1);
fetch("/api/proxy?url=" + endpoint);
</script>

<!-- T07: document.cookie -> setTimeout string -->
<script>
var cookieVal = document.cookie;
setTimeout("processData('" + cookieVal + "')", 100);
</script>

<!-- T08: location.hash -> insertAdjacentHTML -->
<script>
var fragment = location.hash.slice(1);
document.getElementById("t08").insertAdjacentHTML("beforeend", fragment);
</script>

<!-- T09: Multi-hop taint chain: source -> a -> b -> c -> sink -->
<script>
var a = location.hash;
var b = a;
var c = b.substring(1);
document.getElementById("t09").innerHTML = c;
</script>

<!-- T10: Arrow function scope taint -->
<script>
var initWidget = () => {
    var config = location.hash.slice(1);
    document.getElementById("t10").innerHTML = config;
};
initWidget();
</script>

<!-- T11: location.pathname -> window.open (taint-only sink) -->
<script>
var redir = location.pathname;
window.open(redir);
</script>

<!-- T12: document.referrer -> .src assignment (taint-only sink) -->
<script>
var ref = document.referrer;
document.getElementById("t12img").src = ref;
</script>

<!-- T13: Argument taint — source passed through function call -->
<script>
function renderContent(html) {
    document.getElementById("t13").innerHTML = html;
}
var userInput = location.hash.slice(1);
renderContent(userInput);
</script>

<!-- T14: Return value taint — function returns tainted data -->
<script>
function getUserParam() {
    return location.search.substring(1);
}
var val = getUserParam();
document.getElementById("t14").innerHTML = val;
</script>

<!-- T15: document.baseURI -> eval -->
<script>
var base = document.baseURI;
eval("var url = '" + base + "'");
</script>

<!-- T16: document.URL -> document.write -->
<script>
var url = document.URL;
document.write("<a href='" + url + "'>link</a>");
</script>

<!-- T17: storage property access -> outerHTML -->
<script>
var theme = localStorage.userTheme;
document.getElementById("t17").outerHTML = theme;
</script>

<!-- T18: createContextualFragment with tainted data -->
<script>
var payload = location.hash.slice(1);
var range = document.createRange();
var frag = range.createContextualFragment(payload);
document.body.appendChild(frag);
</script>

<!-- T19: Cookie write from user input (lower severity) -->
<script>
var tracking = location.search;
document.cookie = "track=" + tracking;
</script>

<!-- T20: setAttribute with event handler -->
<script>
var handler = location.hash.slice(1);
document.getElementById("t20").setAttribute("onclick", handler);
</script>

<!-- ================================================================
     CROSS-FILE TAINT — globals-writer.js sets window.X from source,
     globals-reader.js reads window.X into sink
     ================================================================ -->
<script src="globals-writer.js"></script>
<script src="globals-reader.js"></script>

<!-- ================================================================
     SECRETS & INTERESTING STRINGS
     ================================================================ -->
<script src="secrets.js"></script>

<!-- ================================================================
     ENDPOINTS
     ================================================================ -->
<script src="endpoints.js"></script>

<!-- ================================================================
     POSTMESSAGE — dedicated handler patterns
     ================================================================ -->
<script src="postmessage.js"></script>

<!-- Placeholder elements -->
<div id="t01"></div><div id="t03"></div><div id="t05"></div>
<div id="t08"></div><div id="t09"></div><div id="t10"></div>
<img id="t12img"><div id="t13"></div><div id="t14"></div>
<div id="t17"></div><div id="t20"></div>
<div id="output"></div>
</body>
</html>
